<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ночь 03:07</title>
<link href="https://fonts.googleapis.com/css2?family=Neucha&display=swap" rel="stylesheet">
<style>
  :root { --bg:#100c18; --paper:#e9e1d0; --muted:#9a90a8; --accent:#c8323f; --panel:#1d1628;
    font-family: "Neucha", "Comic Sans MS", cursive; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--paper); }
  body { display:flex; flex-direction:column; align-items:center; gap:10px; padding: calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 12px); user-select:none; -webkit-user-select:none; }
  #wrap { width:min(100%,520px); position:relative; }
  svg { width:100%; height:auto; display:block; border-radius:12px; background:#000; }
  .hs { fill:transparent; cursor:pointer; }
  .hs:hover { stroke:var(--paper); stroke-opacity:.5; stroke-width:1.5; stroke-dasharray:4 3; }
  .hint .hs { stroke:var(--accent); stroke-width:2; stroke-dasharray:5 3; animation:pulse .6s 2; }
  @keyframes pulse { 50% { stroke-opacity:.2; } }
  .blink { animation:blink 4s infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes blink { 0%,90%,100% { transform:scaleY(1); } 94% { transform:scaleY(.1); } }
  #say { width:min(100%,520px); min-height:92px; padding:12px 14px; border-radius:12px; background:var(--panel); font-size:19px; line-height:1.35; }
  #say.new { animation:fade .4s; }
  @keyframes fade { from { opacity:0; transform:translateY(4px); } }
  #bar { width:min(100%,520px); display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .it, .tool { padding:8px 12px; border:2px solid var(--muted); border-radius:10px; background:transparent; color:var(--paper); font:inherit; font-size:16px; cursor:pointer; }
  .it.on { border-color:var(--accent); background:rgba(200,50,63,.25); }
  .tool { margin-left:auto; border-style:dashed; }
  .tool + .tool { margin-left:0; }
  #empty { color:var(--muted); font-size:15px; }
  .modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:12px; padding:20px; text-align:center; background:rgba(8,5,12,.92); z-index:5; }
  .modal.show { display:flex; }
  .modal h2 { margin:0; font-size:30px; }
  .modal p { margin:0; max-width:340px; font-size:18px; line-height:1.35; color:var(--muted); }
  .modal input { width:150px; padding:10px; text-align:center; font:inherit; font-size:32px; letter-spacing:6px; border-radius:10px; border:2px solid var(--paper); background:#000; color:var(--paper); }
  .go { padding:10px 26px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; font-size:18px; cursor:pointer; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
  <div id="wrap">
    <svg id="scene" viewBox="0 0 400 300">
      <defs><filter id="wob"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter></defs>
      <g id="art"></g>
    </svg>
  </div>
  <div id="say"></div>
  <div id="bar"><span id="empty">Вещей пока нет</span><span id="inv" style="display:contents"></span>
    <button class="tool" id="hintBtn">Искать</button><button class="tool" id="restart">Заново</button></div>

  <div class="modal" id="padM"><h2>Замок</h2><p>Четыре цифры.</p>
    <input id="code" inputmode="numeric" maxlength="4" placeholder="----" autocomplete="off">
    <div><button class="go" id="codeOk">Ввести</button> <button class="tool" id="codeX">Назад</button></div></div>
  <div class="modal" id="endM"><h2>Конец первой главы</h2>
    <p>Мелодия стихла. Тень растаяла, будто её и не было. Мы с Мирой вышли из подвала, держась за руки. Часы в коридоре снова пошли.</p>
    <div><button class="go" id="again">Сыграть заново</button> <a class="go" href="chapter2.html" style="text-decoration:none;display:inline-block">Глава 2 →</a></div></div>

<script>
const $ = (id) => document.getElementById(id);
const L = 'rect class="hs"';
const ink = 'stroke="#e9e1d0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"';

const SCENES = {
  room: `<rect width="400" height="300" fill="#1b1526"/><polygon points="0,235 400,235 400,300 0,300" fill="#120d1b"/>
  <g filter="url(#wob)" ${ink} fill="none">
    <rect x="205" y="30" width="95" height="85" fill="#243049"/><circle cx="238" cy="62" r="14" fill="#d8dca8" stroke="none"/><path d="M252 30V115M205 72H300"/>
    <rect x="50" y="45" width="80" height="62" fill="#e9e1d0" fill-opacity=".12"/><path d="M70 100V58M70 58l-7 11M70 58l7 11M105 100V84M105 84l-4 6M105 84l4 6"/><circle cx="105" cy="78" r="5"/>
    <rect x="18" y="140" width="14" height="98" fill="#2a2038"/><rect x="25" y="165" width="150" height="45" fill="#3a2d4f"/><rect x="38" y="150" width="46" height="20" fill="#cfc8b8" fill-opacity=".85"/><path d="M160 210V238"/>
    <rect x="30" y="212" width="140" height="24" fill="#07050b"/><circle cx="120" cy="226" r="2.5" fill="#d8dca8" stroke="none"/>
    <rect x="215" y="125" width="95" height="115" fill="#2c2236"/><path d="M262 125V240"/><circle cx="256" cy="185" r="3"/><circle cx="268" cy="185" r="3"/>
    <rect x="330" y="105" width="60" height="135" fill="#33283f"/><circle cx="342" cy="178" r="4"/>
  </g>
  <ellipse class="blink" cx="259" cy="165" rx="2.6" ry="3.4" fill="#fff"/><ellipse class="blink" cx="265" cy="165" rx="2.6" ry="3.4" fill="#fff"/>
  <${L} data-h="window" x="205" y="30" width="95" height="85"/><${L} data-h="drawing" x="50" y="45" width="80" height="62"/>
  <${L} data-h="pillow" x="25" y="145" width="110" height="30"/><${L} data-h="under" x="25" y="212" width="150" height="26"/>
  <${L} data-h="wardrobe" x="215" y="125" width="95" height="115"/><${L} data-h="door" x="330" y="105" width="60" height="135"/>`,

  hall: `<rect width="400" height="300" fill="#14202a"/><polygon points="0,240 400,240 400,300 0,300" fill="#0b1219"/>
  <g filter="url(#wob)" ${ink} fill="none">
    <path d="M0 40H400M0 220H400" stroke-opacity=".3"/>
    <rect x="45" y="60" width="70" height="95" fill="#2a2230"/><ellipse cx="80" cy="108" rx="20" ry="28" fill="#cfc8b8" fill-opacity=".75"/>
    <circle cx="72" cy="102" r="4" fill="#fff"/><circle cx="88" cy="102" r="4" fill="#fff"/><circle cx="73" cy="103" r="1.8" fill="#000" stroke="none"/><circle cx="89" cy="103" r="1.8" fill="#000" stroke="none"/><path d="M72 124q8 -5 16 0"/>
    <rect x="160" y="40" width="60" height="150" fill="#3a2d2a"/><circle cx="190" cy="78" r="20" fill="#e9e1d0" fill-opacity=".85"/><path d="M190 78V64M190 78l9 5"/><rect x="186" y="115" width="8" height="55" fill="#6b5a3a"/>
    <rect x="270" y="95" width="75" height="145" fill="#2a2f3a"/><rect x="352" y="150" width="30" height="42" fill="#0a0a0e"/><circle cx="360" cy="160" r="2.5" fill="#c8323f" stroke="none"/><circle cx="374" cy="160" r="2.5" fill="#c8323f" stroke="none"/>
  </g>
  <text x="12" y="285" fill="#e9e1d0" font-size="16">← в детскую</text>
  <${L} data-h="portrait" x="45" y="60" width="70" height="95"/><${L} data-h="clock" x="160" y="40" width="60" height="150"/>
  <${L} data-h="keypad" x="270" y="95" width="115" height="145"/><${L} data-h="toroom" x="0" y="262" width="110" height="38"/>`,

  basement: `<rect width="400" height="300" fill="#0e1115"/><polygon points="0,245 400,245 400,300 0,300" fill="#07080a"/>
  <g filter="url(#wob)" ${ink} fill="none" stroke-opacity=".5"><path d="M0 60H400M0 130H400M0 200H400M70 0V60M210 60V130M120 130V200M300 130V200M40 200V245"/><path d="M330 0V90Q330 110 380 110H400" stroke-width="6"/></g>
  <g filter="url(#wob)" ${ink} fill="none">
    <circle cx="70" cy="200" r="12" fill="#cfc8b8" fill-opacity=".8"/><rect x="56" y="212" width="28" height="34" fill="#4a6a8a"/><path d="M60 246V240M80 246V240"/>
    <path d="M178 250Q172 105 210 62Q248 105 242 250Z" fill="#000" stroke="none"/><path d="M180 140Q150 190 160 230M240 140Q270 190 262 230" stroke="#000" stroke-width="7"/>
  </g>
  <ellipse class="blink" cx="199" cy="115" rx="4" ry="8" fill="#fff"/><ellipse class="blink" cx="221" cy="115" rx="4" ry="8" fill="#fff"/>
  <text x="318" y="285" fill="#e9e1d0" font-size="16">↑ наверх</text>
  <${L} data-h="tim" x="45" y="180" width="55" height="70"/><${L} data-h="shadow" x="165" y="55" width="90" height="200"/><${L} data-h="toHall" x="310" y="262" width="90" height="38"/>`
};

let S, sel;
const flashLabel = () => S.lit ? 'Фонарик (светит)' : 'Фонарик (пустой)';
const NAMES = { bat: () => 'Батарейки', flash: flashLabel, box: () => 'Шкатулка' };

function say(t) { const e = $('say'); e.textContent = t; e.classList.remove('new'); void e.offsetWidth; e.classList.add('new'); }
const has = (i) => S.inv.includes(i);
function add(i) { S.inv.push(i); craft(); renderInv(); }
function craft() {
  if (has('flash') && has('bat') && !S.lit) { S.lit = true; S.inv = S.inv.filter(x => x !== 'bat'); S.crafted = true; }
}
function renderInv() {
  const box = $('inv'); box.innerHTML = '';
  $('empty').style.display = S.inv.length ? 'none' : '';
  S.inv.forEach(i => {
    const b = document.createElement('button');
    b.className = 'it' + (sel === i ? ' on' : ''); b.textContent = NAMES[i]();
    b.onclick = () => { sel = sel === i ? null : i; renderInv(); if (sel) say('Выбрано: ' + NAMES[i]() + '. Теперь нажми на то, к чему это приложить.'); };
    box.appendChild(b);
  });
}
function go(r) { S.room = r; sel = null; $('art').innerHTML = SCENES[r]; renderInv(); }

const H = {
  window: () => say('За окном луна и пустой двор. Качели чуть качаются, будто кто-то только что слез.'),
  drawing: () => say('Рисунок Миры: высокая чёрная фигура и маленький человечек. Подпись кривыми буквами: «она любит воровать с холодильника».'),
  pillow: () => {
    if (!S.gotBat) { S.gotBat = true; add('bat'); say(S.crafted ? 'Под подушкой Миры две батарейки. Я вставила их в фонарик, и он зажёгся!' : 'Под подушкой Тима две батарейки. Он прятал их, чтобы я не брала его фонарик.'); }
    else say('Подушка Миры. Больше ничего.');
  },
  under: () => {
    if (!S.lit) return say('Под кроватью темно. Что-то блестит, но без света не разглядеть.');
    if (!S.gotBox) { S.gotBox = true; add('box'); say('Музыкальная шкатулка! Тетя Ира заводила её, когда мы пердели. Настя взяла её с собой.'); }
    else say('Под кроватью пусто. Только пыль.');
  },
  wardrobe: () => {
    if (!S.gotFlash) { S.gotFlash = true; add('flash'); say(S.crafted ? 'В шкафу лежал фонарик. Батарейки уже есть, он светит!' : 'В шкафу лежит фонарик, но он пустой. Из глубины кто-то тихо дышит. Я быстро закрыла дверцу.'); }
    else say('Из шкафа слышно звон бутылок от водки. Лучше не открывать.');
  },
  door: () => { if (!S.lit) return say('Дальше тёмный коридор. Без света туда не пойду.'); go('hall'); say('Коридор. Луч фонарика дрожит у меня в руке.'); },
  portrait: () => say('Тетя Алена на портрете. Кажется, её глаза двигаются вслед за лучом.'),
  clock: () => { S.clock = true; say('Часы остановились на 03:07. Тетя Ира говорила, что именно в это время всё и началось.'); },
  keypad: () => { if (S.open) { go('basement'); say('Подвал. В углу сидит Мира, а перед ней стоит Тетя Инна...'); } else { $('code').value = ''; $('padM').classList.add('show'); setTimeout(() => $('code').focus(), 50); } },
  toroom: () => { go('room'); say('Детская. Тихо.'); },
  tim: () => say('Настя шепчет: «Не смотри ей в глаза. Помнишь колбасу? Она всегда успокаивалась».'),
  shadow: () => {
    if (sel === 'box') { $('endM').classList.add('show'); return; }
    say(has('box') ? 'Тень повернула голову. Она ждёт... Выбери вещь внизу и нажми на тень.' : 'Тень повернула голову. Она будто ждёт какой-то мелодии. Но у меня нечего завести.');
  },
  toHall: () => { go('hall'); say('Коридор. За спиной тихо шуршит подвал.'); }
};

function reset() {
  S = { room: 'room', inv: [], lit: false, open: false };
  sel = null; $('endM').classList.remove('show'); $('padM').classList.remove('show');
  go('room'); say('Ночь. Настя проснулась от шороха, а кровать Миры пуста. Надо найти эту шлюху.');
}

$('scene').addEventListener('click', (e) => {
  const h = e.target.closest('[data-h]'); if (!h) return;
  const id = h.dataset.h;
  if (sel && !(id === 'shadow' && sel === 'box')) return say('Это здесь не поможет.');
  H[id]();
});
$('hintBtn').onclick = () => { const s = $('scene'); s.classList.add('hint'); setTimeout(() => s.classList.remove('hint'), 1300); };
$('restart').onclick = reset; $('again').onclick = reset;
$('codeX').onclick = () => $('padM').classList.remove('show');
function tryCode() {
  if ($('code').value === '0307') { S.open = true; $('padM').classList.remove('show'); go('basement'); say('Замок щёлкнул. Подвал. В углу сидит Мира, а перед ней стоит Тетя Инна...'); }
  else { $('padM').classList.remove('show'); say('Замок не открылся. Где-то в коридоре есть подсказка с временем.'); }
}
$('codeOk').onclick = tryCode;
$('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryCode(); });
reset();
</script>
</body>
</html>
